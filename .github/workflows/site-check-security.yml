name: Test sicurezza motore analisi

on:
  push:
    branches: [main]
    paths:
      - 'site-check-api/**'
      - 'tests/site_check/**'
      - 'site-check.js'
      - 'strumenti/analisi-sito/index.html'
      - 'ro/instrumente/analiza-site/index.html'
      - '.github/workflows/site-check-security.yml'
  pull_request:
    paths:
      - 'site-check-api/**'
      - 'tests/site_check/**'
      - 'site-check.js'
      - 'strumenti/analisi-sito/index.html'
      - 'ro/instrumente/analiza-site/index.html'
      - '.github/workflows/site-check-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installa dipendenze di produzione e test
        run: python -m pip install -r site-check-api/requirements.txt pytest==9.1.1 httpx==0.28.1 pip-audit
      - name: Verifica protezioni e contratto API
        run: python -m pytest -q tests/site_check
      - name: Verifica JavaScript
        run: node --check site-check.js
      - name: Controlla vulnerabilità note delle dipendenze
        run: python -m pip_audit --progress-spinner off -r site-check-api/requirements.txt
