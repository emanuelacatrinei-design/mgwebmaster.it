name: Pubblica MG Webmaster su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recupera i file
        uses: actions/checkout@v4
      - name: Verifica demo navigabili di tutti i template IT e RO
        continue-on-error: true
        run: python scripts/check_template_demos.py
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Genera immagini hero leggere per le pagine Prezzi
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = [
              Path("assets/offerta-sito-web-7-giorni-prezzi-perugia.webp"),
              Path("assets/oferta-website-7-zile-preturi-romania.webp"),
          ]

          for src in targets:
              with Image.open(src) as im:
                  im = im.convert("RGB")
                  for width in (480, 720):
                      height = round(im.height * width / im.width)
                      resized = im.resize((width, height), Image.Resampling.LANCZOS)
                      out = src.with_name(f"{src.stem}-{width}.webp")
                      resized.save(out, "WEBP", quality=80, method=6)
          PY
      - name: Uniforma la versione CSS su tutte le pagine
        run: |
          find . -type f -name "*.html" -print0 | xargs -0 sed -E -i 's#href="/styles\.css(\?v=[^"]*)?"#href="/styles.css?v=20260926-blog-infographics"#g'
          find . -type f -name "*.html" -print0 | xargs -0 sed -E -i 's#href="/site-design\.css(\?v=[^"]*)?"#href="/site-design.css?v=20260926-blog-infographics"#g'
      - name: Ottimizza i loghi condivisi per tutte le pagine IT e RO
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path(".")
          src = root / "assets" / "mg-webmaster-logo.png"
          out = root / "assets" / "mg-webmaster-logo-footer.webp"

          with Image.open(src) as im:
              im = im.convert("RGBA")
              im.save(out, "WEBP", quality=82, method=6)

          for page in root.rglob("*.html"):
              rel = page.as_posix()
              if rel.startswith("template/") or rel.startswith("ro/template/") or rel.startswith("backups/"):
                  continue

              text = page.read_text(encoding="utf-8")
              text = text.replace(
                  "/assets/mg-webmaster-logo.png",
                  "/assets/mg-webmaster-logo-footer.webp"
              )
              text = re.sub(
                  r'(<img\\s+class="footer-logo"\\s+src="/assets/mg-webmaster-logo-footer\\.webp")(?![^>]*\\bloading=)',
                  r'\\1 loading="lazy" decoding="async" fetchpriority="low"',
                  text
              )
              page.write_text(text, encoding="utf-8")

          print("Footer logo WebP:", out.stat().st_size, "bytes")
          PY
      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
