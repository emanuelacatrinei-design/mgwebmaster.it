name: Pubblica MG Webmaster su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recupera i file
        uses: actions/checkout@v4
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Uniforma la versione CSS su tutte le pagine
        run: |
          find . -type f -name "*.html" -print0 | xargs -0 sed -E -i 's#href="/styles\.css(\?v=[^"]*)?"#href="/styles.css?v=20260922-12"#g'
          find . -type f -name "*.html" -print0 | xargs -0 sed -E -i 's#href="/site-design\.css(\?v=[^"]*)?"#href="/site-design.css?v=20260922-12"#g'
      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
